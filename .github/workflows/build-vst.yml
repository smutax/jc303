name: Build Windows 64-bit VST2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Checkout the main JC303 code base using the standard safe method
    - name: Checkout JC303 Repo
      uses: actions/checkout@v4

    # 2. Initialize submodules safely by rewriting SSH URLs to HTTPS automatically
    - name: Initialize Submodules
      run: |
        git config --global url."https://github.com".insteadOf "git@github.com:"
        git submodule update --init --recursive

    # 3. Checkout your private VST2 SDK using your token
    - name: Checkout Private VST2 SDK
      uses: actions/checkout@v4
      with:
        repository: smutax/vst2_Juice_build
        token: ${{ secrets.VST_SDK_TOKEN }}
        path: vstsdk2 

    # 4. Setup CMake build environment (Providing the VST2 path safely)
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF -Djuce_vst2_sdk_path="${{ github.workspace }}/vstsdk2"

    # 5. Build the universal main target
    - name: Build VST2 Plugin
      run: cmake --build build --config Release --target jc303

    # INSERT HERE: This lists every compiled .dll file in your build folder directly to your screen logs
    - name: List Build Files for Diagnostics
      run: Get-ChildItem -Recurse build\*.dll | Select-Object FullName

    # 6. Extract and upload the real VST2 .dll file safely
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jc303-windows-vst2
        path: |
          build/jc303_Artefacts/Release/VST/jc303.dll
          build/jc303_artefacts/Release/VST/jc303.dll
          build/jc303_artefacts/Release/jc303.dll
        if-no-files-found: warn
