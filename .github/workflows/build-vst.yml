name: Build Windows 64-bit VST2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Checkout the main JC303 code base
    - name: Checkout JC303 Repo
      uses: actions/checkout@v4

    # 2. Initialize submodules safely
    - name: Initialize Submodules
      run: |
        git config --global url."https://github.com".insteadOf "git@github.com:"
        git submodule update --init --recursive

    # 3. Checkout your private VST2 SDK
    - name: Checkout Private VST2 SDK
      uses: actions/checkout@v4
      with:
        repository: smutax/vst2_Juice_build
        token: ${{ secrets.VST_SDK_TOKEN }}
        path: vstsdk2 

    # 4. FORCE VST2 format activation by cleanly appending it to the format list variable
    - name: Inject VST2 into CMakeLists
      shell: pwsh
      run: |
        $path = "CMakeLists.txt"
        $content = Get-Content $path -Raw
        # Look for the exact line defining the formats list and add VST2 to the end of it
        if ($content -match "set\(PLUGIN_FORMATS") {
            $content = $content -replace "set\(PLUGIN_FORMATS (.*?)\)", 'set(PLUGIN_FORMATS $1 VST2)'
            Set-Content -Path $path -Value $content
            Write-Host "Successfully appended VST2 to PLUGIN_FORMATS variable!"
        } else {
            Write-Host "Warning: PLUGIN_FORMATS definition block not found!"
        }

    # 5. Setup CMake build environment
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF -Djuce_vst2_sdk_path="${{ github.workspace }}/vstsdk2"

    # 6. Build the universal code base
    - name: Build VST2 Plugin
      run: cmake --build build --config Release

    # 7. Print all generated .dll files to verify the output path
    - name: List Build Files for Diagnostics
      run: Get-ChildItem -Recurse build\*.dll | Select-Object FullName

    # 8. Dynamic scan upload matching only the true VST2 standalone file
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jc303-windows-vst2
        path: |
          build/**/Release/VST/jc303.dll
          build/**/Release/jc303.dll
        if-no-files-found: warn
